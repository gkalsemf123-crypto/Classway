<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassWay - 신입생을 위한 캠퍼스 맵</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #4A90E2;
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 80px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #FFD166;
        }

        nav ul li {
            position: relative;
            padding: 10px 0;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background-color: #ffffff;
            min-width: 140px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 8px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 200;
        }

        nav ul li:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .dropdown-menu a {
            display: block;
            color: #424242;
            font-size: 0.95rem;
            padding: 8px 15px;
            text-align: center;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .dropdown-menu a:hover {
            background-color: #F1F8FF;
            color: #4A90E2;
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-actions a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .user-actions .signup-btn {
            border: 1px solid #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .user-actions .signup-btn:hover {
            background-color: #ffffff;
            color: #4A90E2;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 20px;
            background: #F8F9FA;
            overflow: hidden;
        }

        .content-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            text-align: center;
            transition: opacity 0.4s ease-in-out;
        }

        .ai-greeting h1 {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2C3E50 0%, #4A90E2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ai-input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #fff;
            border-radius: 30px;
            padding: 8px 15px;
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.15);
            border: 1px solid rgba(74, 144, 226, 0.2);
            width: 100%;
        }

        .ai-prompt-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px;
            font-size: 1rem;
            background: transparent;
            color: #333;
        }

        .classroom-container {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            transition: opacity 0.4s ease-in-out;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            flex: 1;
            position: relative;
        }

        .classroom-map-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 10px 15px;
            overflow: hidden;
        }

        .floor-tabs-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 2px;
            width: 100%;
        }

        .floor-tabs {
            display: inline-flex;
            background-color: #F1F3F5;
            padding: 5px;
            border-radius: 30px;
        }

        .floor-tab {
            padding: 8px 30px;
            border: none;
            background-color: transparent;
            color: #495057;
            border-radius: 25px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .floor-tab.active {
            background-color: white;
            color: #228BE6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .floor-plan-image {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .floor-plan-image img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
        }

        .search-toggle-btn, .chatbot-toggle-btn {
            position: absolute;
            right: 30px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid #4A90E2;
            z-index: 101;
            transition: all 0.3s ease;
        }

        .search-toggle-btn:hover, .chatbot-toggle-btn:hover {
            transform: scale(1.1);
            border-color: #357ABD;
        }

        .search-toggle-btn { bottom: 100px; font-size: 1.6rem; }
        .chatbot-toggle-btn { bottom: 30px; font-size: 1.8rem; }

        .search-toggle-btn.active, .chatbot-toggle-btn.active {
            right: 280px;
            transform: scale(0.9);
        }

        .classroom-search-section, .classroom-chatbot-section {
            width: 0;
            min-width: 0;
            opacity: 0;
            padding: 0;
            border: none;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            margin-left: 0;
        }

        .classroom-search-section.active, .classroom-chatbot-section.active {
            width: 250px;
            min-width: 250px;
            opacity: 1;
            border: 1px solid #e2e8f0;
            margin-left: 10px;
        }

        .panel-header {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: white;
            padding: 15px;
            text-align: center;
        }

        footer {
            display: flex;
            text-align: center;
            background-color: #2C3E50;
            color: #ECF0F1;
            align-items: center;
        }

        footer > div {
            padding: 10px 0;
            box-sizing: border-box;
        }

        .footer-left {
            width: 20%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #34495E;
        }

        .footer-left-links {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .footer-link {
            color: #BDC3C7;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-center {
            width: 60%;
            font-size: 1.05rem;
            font-weight: 500;
            color: #BDC3C7;
        }

        .footer-right {
            width: 20%;
            border-left: 1px solid #34495E;
            font-size: 0.95rem;
            color: #95a5a6;
        }

        .hidden { display: none !important; }
        @keyframes pulsePin { 0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); } 100% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); } }
    </style>
</head>

<body>

    <header>
        <div class="header-container">
            <div class="logo"><a href="#">ClassWay</a></div>
            <nav>
                <ul>
                    <li><a href="#" id="nav-home">홈</a></li>
                    <li><a href="#" id="nav-classroom">강의실 찾기</a></li>
                    <li><a href="#">공지사항</a></li>
                </ul>
            </nav>
            <div class="user-actions">
                <a href="#" class="login-btn">로그인</a>
                <a href="#" class="signup-btn">회원가입</a>
            </div>
        </div>
    </header>

    <main>
        <div class="content-container" id="home-content">
            <div class="ai-greeting">
                <h1>안녕하세요!<br>ClassWay 도우미입니다.</h1>
                <p>무엇을 도와드릴까요?</p>
            </div>
            <div class="ai-input-area">
                <button style="border:none; background:none; font-size:1.5rem; cursor:pointer;">📎</button>
                <input type="text" class="ai-prompt-input" placeholder="질문을 입력하세요...">
                <button style="background: #4A90E2; color: white; border-radius: 50%; width: 44px; height: 44px; border:none; cursor:pointer;">➤</button>
            </div>
        </div>

        <div class="classroom-container hidden" id="classroom-view">
            <div class="classroom-map-section">
                <div class="floor-tabs-wrapper">
                    <div class="floor-tabs">
                        <button class="floor-tab active" data-floor="1">1층</button>
                        <button class="floor-tab" data-floor="2">2층</button>
                        <button class="floor-tab" data-floor="3">3층</button>
                    </div>
                </div>
                <div class="floor-plan-image">
                    <div id="tight-map-wrapper" style="position: relative; display: inline-block;">
                        <img id="main-floor-map" src="./floor1_plan.png.png" alt="도면" style="transition: opacity 0.2s ease;">
                        <div id="search-pin-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100;"></div>
                    </div>
                </div>
            </div>

            <div class="classroom-search-section" id="classroom-search-section">
                <div class="panel-header"><h4>🔍 강의실 검색</h4></div>
                <div style="padding: 20px; display: flex; flex-direction: column; gap: 15px;">
                    <input type="text" id="map-room-search" style="padding: 12px; border: 2px solid #4A90E2; border-radius: 10px; outline: none;" placeholder="강의실 번호 입력 (예: 3128)">
                    <button id="map-room-search-btn" style="padding: 10px; background: #4A90E2; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">위치 찾기</button>
                </div>
            </div>

            <div class="classroom-chatbot-section" id="classroom-chatbot-section">
                <div class="panel-header"><h4>🤖 빈 강의실 도우미</h4></div>
                <div style="flex:1; padding:15px; background:#F8F9FA; font-size:0.9rem;">시간대를 입력해주세요!</div>
            </div>

            <button id="search-toggle-btn" class="search-toggle-btn">🔍</button>
            <button id="chatbot-toggle-btn" class="chatbot-toggle-btn">🤖</button>
        </div>
    </main>

    <footer id="main-footer">
        <div class="footer-left">
            <div class="footer-left-links">
                <a href="#" class="footer-link">🌐 조선대 홈페이지</a>
                <a href="#" class="footer-link">🎓 사이버 캠퍼스</a>
                <a href="#" class="footer-link">🚌 셔틀버스 정보</a>
            </div>
        </div>
        <div class="footer-center">© 2026 ClassWay 팀 프로젝트. All rights reserved.</div>
        <div class="footer-right"><a href="#" style="color:#BDC3C7; text-decoration:none;">고객센터</a></div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const homeView = document.getElementById('home-content');
            const classroomView = document.getElementById('classroom-view');
            const mainFooter = document.getElementById('main-footer');
            const pinLayer = document.getElementById('search-pin-layer');

            // 1. 뷰 전환 로직
            const switchView = (toHome) => {
                if (toHome) {
                    classroomView.classList.add('hidden');
                    homeView.classList.remove('hidden');
                    mainFooter.classList.remove('hidden');
                } else {
                    homeView.classList.add('hidden');
                    classroomView.classList.remove('hidden');
                    mainFooter.classList.add('hidden');
                }
            };

            document.getElementById('nav-classroom').onclick = (e) => { e.preventDefault(); switchView(false); };
            document.getElementById('nav-home').onclick = (e) => { e.preventDefault(); switchView(true); };

            // 2. 층 탭 제어 (핀 삭제 로직 추가)
            const mainFloorTabs = document.querySelectorAll('.floor-tab');
            const mainFloorMap = document.getElementById('main-floor-map');
            const floorImages = { '1': './floor1_plan.png.png', '2': './floor2_plan.png.png', '3': './floor3_plan.png.png' };
            
            mainFloorTabs.forEach(tab => {
                tab.onclick = () => {
                    mainFloorTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    mainFloorMap.src = floorImages[tab.dataset.floor];
                    
                    // 🔴 [기능 추가] 층 이동 시 핀 지우기
                    if (pinLayer) pinLayer.innerHTML = '';
                };
            });

            // 3. 토글 시스템
            const setupToggle = (btnId, sectionId, idleIcon) => {
                const btn = document.getElementById(btnId);
                const section = document.getElementById(sectionId);
                btn.onclick = () => {
                    const isActive = section.classList.toggle('active');
                    btn.classList.toggle('active');
                    btn.innerHTML = isActive ? '✖' : idleIcon;
                };
            };
            setupToggle('chatbot-toggle-btn', 'classroom-chatbot-section', '🤖');
            setupToggle('search-toggle-btn', 'classroom-search-section', '🔍');

            // 4. 검색 로직
            const runSearch = async () => {
                const val = document.getElementById('map-room-search').value.trim();
                if (!val) return;
                try {
                    const res = await fetch('./classrooms.json');
                    const data = await res.json();
                    let target = null; let floorNum = '1';
                    for (const f of ["1", "2", "3"]) {
                        const found = (data[f] || []).find(r => r.room.includes(val));
                        if (found) { target = found; floorNum = f; break; }
                    }
                    if (target) {
                        const targetTab = document.querySelector(`.floor-tab[data-floor="${floorNum}"]`);
                        if (!targetTab.classList.contains('active')) targetTab.click();
                        setTimeout(() => {
                            pinLayer.innerHTML = `<div style="position: absolute; left: ${target.x}%; top: ${target.y}%; width: 18px; height: 18px; background: #E74C3C; border-radius: 50%; transform: translate(-50%, -50%); border: 3px solid white; animation: pulsePin 1.5s infinite; z-index: 1000;"><div style="position: absolute; top: -35px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; white-space: nowrap;">${target.room}</div></div>`;
                        }, 600);
                    } else { alert("찾을 수 없습니다."); }
                } catch (e) { console.error(e); }
            };

            // 🔴 [기능 추가] 버튼 클릭 & 엔터키 이벤트 연결
            document.getElementById('map-room-search-btn').onclick = runSearch;
            document.getElementById('map-room-search').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault(); // 페이지 새로고침 방지
                    runSearch();
                }
            });

            // [좌표 도구]
            mainFloorMap.addEventListener('mousedown', function(e) {
                const rect = mainFloorMap.getBoundingClientRect();
                console.log(`{ "room": "강의실명", "x": ${((e.clientX - rect.left) / rect.width * 100).toFixed(2)}, "y": ${((e.clientY - rect.top) / rect.height * 100).toFixed(2)} },`);
            });
        });
    </script>
</body>

</html>
